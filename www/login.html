<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!-- Particles Canvas -->
    <canvas id="particles-canvas"></canvas>

    <div class="login-wrapper">
        <!-- Mascot SVG -->
        <div class="mascot-container" id="mascot">
            <svg id="mascot-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">

                <!-- Tail feathers -->
                <ellipse cx="100" cy="192" rx="18" ry="10" fill="#b0bec5" transform="rotate(0 100 192)"/>
                <ellipse cx="84"  cy="196" rx="13" ry="8"  fill="#90a4ae" transform="rotate(-18 84 196)"/>
                <ellipse cx="116" cy="196" rx="13" ry="8"  fill="#90a4ae" transform="rotate(18 116 196)"/>
                <ellipse cx="70"  cy="198" rx="10" ry="6"  fill="#b0bec5" transform="rotate(-30 70 198)"/>
                <ellipse cx="130" cy="198" rx="10" ry="6"  fill="#b0bec5" transform="rotate(30 130 198)"/>

                <!-- Body -->
                <ellipse cx="100" cy="168" rx="48" ry="40" fill="#eceff1"/>
                <!-- Chest / belly shading -->
                <ellipse cx="100" cy="175" rx="30" ry="26" fill="#f5f5f5" opacity="0.8"/>

                <!-- Left wing (resting) -->
                <ellipse cx="57" cy="162" rx="22" ry="36" fill="#b0bec5" transform="rotate(-12 57 162)"/>
                <ellipse cx="52" cy="168" rx="16" ry="28" fill="#90a4ae" transform="rotate(-15 52 168)"/>
                <!-- Wing feather detail left -->
                <path d="M 42 155 Q 50 170 44 185" stroke="#78909c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M 50 152 Q 56 168 50 184" stroke="#78909c" stroke-width="1.5" fill="none" stroke-linecap="round"/>

                <!-- Right wing (resting) -->
                <ellipse cx="143" cy="162" rx="22" ry="36" fill="#b0bec5" transform="rotate(12 143 162)"/>
                <ellipse cx="148" cy="168" rx="16" ry="28" fill="#90a4ae" transform="rotate(15 148 168)"/>
                <!-- Wing feather detail right -->
                <path d="M 158 155 Q 150 170 156 185" stroke="#78909c" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M 150 152 Q 144 168 150 184" stroke="#78909c" stroke-width="1.5" fill="none" stroke-linecap="round"/>

                <!-- Neck -->
                <ellipse cx="100" cy="130" rx="28" ry="20" fill="#eceff1"/>
                <!-- Neck iridescent shimmer -->
                <ellipse cx="100" cy="128" rx="18" ry="12" fill="#80cbc4" opacity="0.25"/>

                <!-- Head -->
                <ellipse cx="100" cy="100" rx="42" ry="40" fill="#eceff1"/>
                <!-- Head top feather crest -->
                <ellipse cx="100" cy="63" rx="7" ry="14" fill="#eceff1" transform="rotate(-5 100 63)"/>
                <ellipse cx="110" cy="66" rx="5" ry="10" fill="#cfd8dc" transform="rotate(10 110 66)"/>
                <ellipse cx="90"  cy="66" rx="5" ry="10" fill="#cfd8dc" transform="rotate(-10 90 66)"/>

                <!-- Eyes group -->
                <g id="eyes-group">
                    <!-- Left eye white -->
                    <ellipse id="left-eye-white" cx="82" cy="100" rx="13" ry="14" fill="white"/>
                    <!-- Right eye white -->
                    <ellipse id="right-eye-white" cx="118" cy="100" rx="13" ry="14" fill="white"/>
                    <!-- Eye rings (pigeon orange ring) -->
                    <ellipse cx="82"  cy="100" rx="13" ry="14" fill="none" stroke="#ff8f00" stroke-width="2.5"/>
                    <ellipse cx="118" cy="100" rx="13" ry="14" fill="none" stroke="#ff8f00" stroke-width="2.5"/>
                    <!-- Left pupil -->
                    <circle id="left-pupil"  cx="82"  cy="102" r="6.5" fill="#1a1a2e"/>
                    <!-- Right pupil -->
                    <circle id="right-pupil" cx="118" cy="102" r="6.5" fill="#1a1a2e"/>
                    <!-- Shine left -->
                    <circle id="left-shine"  cx="85"  cy="98"  r="2.5" fill="white"/>
                    <!-- Shine right -->
                    <circle id="right-shine" cx="121" cy="98"  r="2.5" fill="white"/>
                </g>

                <!-- Blush -->
                <ellipse cx="68"  cy="112" rx="11" ry="7" fill="#ef9a9a" opacity="0.45"/>
                <ellipse cx="132" cy="112" rx="11" ry="7" fill="#ef9a9a" opacity="0.45"/>

                <!-- Beak -->
                <path d="M 92 118 Q 100 125 108 118 Q 104 130 100 132 Q 96 130 92 118 Z" fill="#ff8f00"/>
                <path d="M 92 118 Q 100 125 108 118" stroke="#e65100" stroke-width="1" fill="none"/>
                <!-- Beak nostril bump -->
                <ellipse cx="100" cy="119" rx="10" ry="5" fill="#ffb300" opacity="0.6"/>

                <!-- Smile (beak open happy) -->
                <path id="mouth" d="M 94 128 Q 100 134 106 128" stroke="#e65100" stroke-width="2" fill="none" stroke-linecap="round"/>

                <!-- Feet -->
                <line x1="88"  y1="205" x2="82"  y2="215" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>
                <line x1="88"  y1="205" x2="88"  y2="217" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>
                <line x1="88"  y1="205" x2="94"  y2="215" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>
                <line x1="112" y1="205" x2="106" y2="215" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>
                <line x1="112" y1="205" x2="112" y2="217" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>
                <line x1="112" y1="205" x2="118" y2="215" stroke="#ff8f00" stroke-width="3" stroke-linecap="round"/>

                <!-- Wings covering eyes — shown when typing password -->
                <g id="hands-cover" style="opacity:0; transition: opacity 0.35s ease;">
                    <!-- Left wing raised -->
                    <ellipse cx="68" cy="97" rx="34" ry="22" fill="#90a4ae" transform="rotate(-20 68 97)"/>
                    <ellipse cx="55" cy="90" rx="24" ry="15" fill="#b0bec5" transform="rotate(-25 55 90)"/>
                    <!-- Left feather tips -->
                    <ellipse cx="40" cy="80" rx="9" ry="18" fill="#90a4ae" transform="rotate(-35 40 80)"/>
                    <ellipse cx="52" cy="72" rx="9" ry="18" fill="#b0bec5" transform="rotate(-20 52 72)"/>
                    <ellipse cx="65" cy="70" rx="9" ry="16" fill="#90a4ae" transform="rotate(-8 65 70)"/>

                    <!-- Right wing raised -->
                    <ellipse cx="132" cy="97" rx="34" ry="22" fill="#90a4ae" transform="rotate(20 132 97)"/>
                    <ellipse cx="145" cy="90" rx="24" ry="15" fill="#b0bec5" transform="rotate(25 145 90)"/>
                    <!-- Right feather tips -->
                    <ellipse cx="160" cy="80" rx="9" ry="18" fill="#90a4ae" transform="rotate(35 160 80)"/>
                    <ellipse cx="148" cy="72" rx="9" ry="18" fill="#b0bec5" transform="rotate(20 148 72)"/>
                    <ellipse cx="135" cy="70" rx="9" ry="16" fill="#90a4ae" transform="rotate(8 135 70)"/>
                </g>
            </svg>
        </div>

        <!-- Login Card -->
        <div class="login-card" id="loginCard">
            <div class="login-header">
                <h1>Chào mừng trở lại!</h1>
                <p>Đăng nhập để tiếp tục</p>
            </div>

            <form id="loginForm" novalidate>
                <!-- Username -->
                <div class="input-group" id="usernameGroup">
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="username" name="username" placeholder=" " autocomplete="off" required>
                    <label for="username">Tên đăng nhập</label>
                    <div class="input-line"></div>
                </div>

                <!-- Password -->
                <div class="input-group" id="passwordGroup">
                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" name="password" placeholder=" " required>
                    <label for="password">Mật khẩu</label>
                    <div class="input-line"></div>
                    <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <!-- Error message -->
                <div class="error-msg" id="errorMsg">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Tên đăng nhập hoặc mật khẩu không đúng!</span>
                </div>

                <!-- Options -->
                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span class="custom-checkbox"></span>
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-pass">Quên mật khẩu?</a>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Đăng nhập</span>
                    <i class="fa-solid fa-spinner fa-spin spinner" id="spinner"></i>
                    <i class="fa-solid fa-arrow-right btn-arrow"></i>
                </button>
            </form>

            <p class="register-link">Chưa có tài khoản? <a href="#">Đăng ký ngay</a></p>
        </div>
    </div>

    <!-- Success overlay -->
    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2>Đăng nhập thành công!</h2>
            <p>Đang chuyển hướng...</p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
